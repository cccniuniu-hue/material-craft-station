server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: material-workshop
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/workshop?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:workshop}
    password: ${DB_PASSWORD:workshop}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s
mybatis:
  configuration:
    map-underscore-to-camel-case: true
storage:
  directory: ${STORAGE_DIR:./storage}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
